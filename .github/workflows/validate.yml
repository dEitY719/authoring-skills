name: validate

# Validation is defined once, in `harness-skills`, and called from all fifteen
# split-out skill repos (dEitY719/dotfiles#1410 D-10). Do not re-inline the
# checks here: a copy is a fifteen-way drift risk, which is exactly what
# NF-2 forbids.
#
# To change what is checked, edit
# dEitY719/harness-skills/.github/workflows/skill-check.yml.
#
# The workflow called below is named `skill-check` and this repo also ships a
# skill named `skill-check`. They are different layers, not a cycle: one is a
# GitHub Actions job, the other is a SKILL.md audit procedure. See CLAUDE.md ->
# "The skill-check name appears twice".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: dEitY719/harness-skills/.github/workflows/skill-check.yml@main
    with:
      plugin-name: authoring
      # skill-check documents the repo-wide emoji ban and its one exception —
      # the `ai-metrics` footer glyphs — so its reference files must show the
      # real glyphs to be readable as policy. Nothing else in this repo may
      # carry one. See CLAUDE.md -> "Emojis".
      allow-emoji-paths: skills/skill-check/references/
